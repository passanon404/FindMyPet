<!DOCTYPE html>
<html lang="th">
<head><meta charset="utf-8"><meta content="width=device-width,initial-scale=1" name="viewport">
<title>FindMyPet - แผนที่มหาวิทยาลัยพะเยา</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  body{font-family:Inter,sans-serif;background:#f3faff;color:#071e27}
  .material-symbols-outlined{font-variation-settings:'FILL'0,'wght'400,'GRAD'0,'opsz'24}
  #map{width:100%;height:calc(100vh - 80px);min-height:500px;border-radius:0}
  .walking-person {
    font-size: 24px;
    text-align: center;
    line-height: 36px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    animation: walkBounce 0.5s ease-in-out infinite alternate;
  }
  @keyframes walkBounce {
    from { transform: translateY(0); }
    to { transform: translateY(-4px); }
  }
</style>
</head>
<body class="flex flex-col h-screen overflow-hidden">
<header class="bg-[#f3faff] shadow-sm flex justify-between items-center px-6 py-3 w-full sticky top-0 z-50">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#9f4122] text-3xl" style="font-variation-settings:'FILL'1">pets</span>
<h1 class="text-[24px] font-['Plus_Jakarta_Sans'] font-bold text-[#9f4122]">FindMyPet</h1>
</div>
<nav class="hidden md:flex items-center gap-6">
<a href="../index.html" class="text-[#56423c] hover:text-[#9f4122]">ข่าวสาร</a>
<a href="map.html" class="text-[#9f4122] font-bold border-b-2 border-[#9f4122] pb-1">แผนที่</a>
<a href="report.html" class="text-[#56423c] hover:text-[#9f4122]">แจ้งเบาะแส</a>
</div>
<div class="flex items-center gap-3">
<a href="../en/map.html" class="text-sm text-[#56423c] hover:text-[#9f4122]"><span class="material-symbols-outlined text-lg">language</span> EN</a>
<span class="material-symbols-outlined text-[#56423c]">account_circle</span>
</div>
</header>
<main class="flex-1 relative">
<div id="map"></div>
</main>


<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API_BASE = '/api';

// ========== พิกัดมหาวิทยาลัยพะเยา (จาก OSM) ==========
const UP_CENTER = [19.029965, 99.893529];
const UP_BOUNDS = [[19.021085, 99.880051], [19.038342, 99.906009]];

// ========== จุดเฝ้าระวังตัวอย่างรอบมหาวิทยาลัย ==========
const SPOTS = [
  { lat: 19.0350, lng: 99.8980, label: 'ประตูทางเข้า 1 (ฝั่งทิศเหนือ)', type: 'watch' },
  { lat: 19.0255, lng: 99.8960, label: 'ประตูทางเข้า 2 (ฝั่งทิศใต้)', type: 'watch' },
  { lat: 19.0310, lng: 99.9010, label: 'ลานจอดรถคณะวิทย์', type: 'safe' },
  { lat: 19.0285, lng: 99.8850, label: 'หอพักนักศึกษา', type: 'safe' },
  { lat: 19.0335, lng: 99.8920, label: 'โรงอาหารกลาง', type: 'watch' },
  { lat: 19.0270, lng: 99.8890, label: 'สนามกีฬา', type: 'safe' },
  { lat: 19.0305, lng: 99.8830, label: 'คณะศิลปศาสตร์', type: 'safe' },
  { lat: 19.0340, lng: 99.8955, label: 'ป้ายรถเมล์หน้ามหาวิทยาลัย', type: 'watch' },
  { lat: 19.0260, lng: 99.8990, label: 'จุดทิ้งขยะหลังหอ', type: 'risk' },
  { lat: 19.0325, lng: 99.8875, label: 'ซอยข้างคณะวิศวะ', type: 'risk' },
];

// ========== ตัวแปรส่วนกลาง ==========
let map;
let walkingMarkers = [];     // ตัวลาดตระเวน
let walkingAngles = [];      // มุมปัจจุบันของแต่ละตัว
let animFrameId = null;
const ANIMATION_SPEED = 0.003; // radian per frame (~60fps → 1 รอบ ~ 3.5 นาที)

// ========== เริ่มต้นแผนที่ ==========
function initMap() {
  map = L.map('map').setView(UP_CENTER, 16);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(map);

  // แสดงขอบเขตมหาวิทยาลัย
  L.rectangle(UP_BOUNDS, {
    color: '#9f4122',
    weight: 2,
    fill: false,
    dashArray: '8, 8',
    opacity: 0.5
  }).addTo(map);

  // จุดเฝ้าระวัง
  SPOTS.forEach(s => {
    const colorMap = { safe: '#286b33', watch: '#9f4122', risk: '#ba1a1a' };
    const labelMap = { safe: '✅ โซนปลอดภัย', watch: '👁️ จุดเฝ้าระวัง', risk: '⚠️ จุดเสี่ยง' };
    const color = colorMap[s.type] || '#9f4122';
    const icon = L.divIcon({
      className: '',
      html: `<div style="width:16px;height:16px;border-radius:50%;background:${color};border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3)"></div>`,
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    });
    const marker = L.marker([s.lat, s.lng], { icon }).addTo(map);
    marker.bindPopup(`<strong>${s.label}</strong><br><span style="color:#56423c;font-size:12px">${labelMap[s.type] || ''}</span>`);
  });

  // โหลด reports และสร้างโซน
  loadDataAndInit(map);

  // ปุ่มหาตำแหน่งปัจจุบัน
  if (navigator.geolocation) {
    L.control.locate({
      position: 'topleft',
      strings: { title: 'แสดงตำแหน่งปัจจุบัน' },
      locateOptions: { enableHighAccuracy: true }
    }).addTo(map);
  }
}

// ========== โหลดข้อมูลจาก API ==========
async function loadDataAndInit(map) {
  try {
    const res = await fetch(`${API_BASE}/reports?limit=200`);
    const data = await res.json();
    const reports = data.reports || [];

    // 1. วาง Marker จากรายงาน
    placeReportMarkers(map, reports);

    // 2. วิเคราะห์ความหนาแน่นและสร้าง Heat Zone
    const zones = analyzeDensity(reports);
    createHeatZones(map, zones);

    // 3. เริ่มอนิเมชั่นคนเดิน
    startWalkingAnimation(map, zones);
  } catch (e) {
    console.error('Failed to load reports:', e);
    // Fallback: สร้างโซนจำลอง
    const demoZones = generateDemoZones();
    createHeatZones(map, demoZones);
    startWalkingAnimation(map, demoZones);
  }
}

// ========== วาง Marker รายงาน ==========
function placeReportMarkers(map, reports) {
  reports.forEach(r => {
    const lat = parseFloat(r.latitude);
    const lng = parseFloat(r.longitude);
    if (isNaN(lat) || isNaN(lng)) return;

    const isEmergency = r.condition === 'ฉุกเฉิน';
    const color = isEmergency ? '#ba1a1a' : r.condition === 'ประชาสัมพันธ์' ? '#286b33' : '#006398';
    const typeLabel = r.animal_type === 'อื่นๆ' && r.animal_type_custom ? r.animal_type_custom : r.animal_type;

    const marker = L.marker([lat, lng]).addTo(map);
    marker.bindPopup(`
      <b style="font-size:14px">${r.title || typeLabel}</b><br>
      <span style="color:#56423c;font-size:12px">${r.condition}</span><br>
      <a href="../index.html" style="color:#9f4122;font-weight:600;font-size:13px">ดูรายละเอียด →</a>
    `);
  });
}

// ========== วิเคราะห์ความหนาแน่นของรายงาน (cluster) ==========
function analyzeDensity(reports) {
  // กรองเฉพาะรายงานที่มีพิกัด
  const withCoords = reports.filter(r => {
    const lat = parseFloat(r.latitude);
    const lng = parseFloat(r.longitude);
    return !isNaN(lat) && !isNaN(lng);
  });

  if (withCoords.length === 0) return generateDemoZones();

  // ใช้ grid-based clustering: แบ่งพื้นที่เป็นตาราง 0.003 องศา (~300m)
  const gridSize = 0.003;
  const clusters = {};

  withCoords.forEach(r => {
    const lat = parseFloat(r.latitude);
    const lng = parseFloat(r.longitude);
    const cellX = Math.floor(lat / gridSize);
    const cellY = Math.floor(lng / gridSize);
    const key = `${cellX}_${cellY}`;
    if (!clusters[key]) {
      clusters[key] = { count: 0, lats: [], lngs: [], centerLat: 0, centerLng: 0 };
    }
    clusters[key].count++;
    clusters[key].lats.push(lat);
    clusters[key].lngs.push(lng);
  });

  const zones = [];
  for (const key in clusters) {
    const c = clusters[key];
    if (c.count < 2) continue; // ไม่สร้างโซนสำหรับ 1 รายการ
    c.centerLat = c.lats.reduce((a, b) => a + b) / c.lats.length;
    c.centerLng = c.lngs.reduce((a, b) => a + b) / c.lngs.length;
    zones.push({
      lat: c.centerLat,
      lng: c.centerLng,
      count: c.count,
      // แดง = 3+ ตัว, เหลือง = 2-3 ตัว
      level: c.count >= 3 ? 'high' : 'medium'
    });
  }

  // ถ้าไม่มี zone ให้ใช้ demo
  if (zones.length === 0) return generateDemoZones();
  return zones;
}

// ========== โซนจำลองสำหรับตัวอย่าง (เมื่อไม่มีข้อมูลจริง) ==========
function generateDemoZones() {
  return [
    { lat: 19.0315, lng: 99.8890, count: 5, level: 'high' },   // กลางมหาวิทยาลัย
    { lat: 19.0345, lng: 99.8960, count: 4, level: 'high' },   // หน้าประตู
    { lat: 19.0270, lng: 99.8855, count: 3, level: 'high' },   // หอพัก
    { lat: 19.0280, lng: 99.8980, count: 2, level: 'medium' }, // ข้างถนน
    { lat: 19.0330, lng: 99.8840, count: 2, level: 'medium' }, // คณะมนุษยศาสตร์
    { lat: 19.0360, lng: 99.9010, count: 2, level: 'medium' }, // ปากทางเข้า
  ];
}

// ========== สร้าง Heat Zone บนแผนที่ ==========
function createHeatZones(map, zones) {
  zones.forEach(z => {
    const isHigh = z.level === 'high';
    const radius = isHigh ? 100 : 70; // เมตร
    const color = isHigh ? '#e53935' : '#fdd835';
    const fillColor = isHigh ? '#e53935' : '#fdd835';
    const fillOpacity = isHigh ? 0.25 : 0.18;

    // วงกลมโซน
    const circle = L.circle([z.lat, z.lng], {
      color: color,
      fillColor: fillColor,
      fillOpacity: fillOpacity,
      weight: isHigh ? 3 : 2,
      opacity: 0.7,
      radius: radius
    }).addTo(map);

    circle.bindPopup(`
      <strong style="color:${color}">${isHigh ? '🔴 โซนพบสัตว์บ่อย' : '🟡 โซนพบสัตว์ปานกลาง'}</strong><br>
      <span style="color:#56423c">จำนวนที่พบ: ${z.count} ตัว</span>
    `);

    // สำหรับโซน high ให้เก็บไว้ใช้กับ animation
    if (isHigh) {
      z._circle = circle;
      z._radius = radius;
    }
  });
}

// ========== อนิเมชั่นคนเดินลาดตระเวน ==========
function startWalkingAnimation(map, zones) {
  const highZones = zones.filter(z => z.level === 'high');
  if (highZones.length === 0) return;

  // สร้างคนเดินสำหรับแต่ละโซนระดับสูง
  highZones.forEach((z, idx) => {
    const angle = (idx / highZones.length) * 2 * Math.PI;
    walkingAngles[idx] = angle;

    const icon = L.divIcon({
      className: '',
      html: '<div class="walking-person">🚶</div>',
      iconSize: [36, 36],
      iconAnchor: [18, 18]
    });

    const initialPos = getCirclePoint(z.lat, z.lng, z._radius || 100, angle);
    const marker = L.marker(initialPos, { icon }).addTo(map);
    walkingMarkers[idx] = { marker, zone: z };
  });

  // เริ่ม loop อนิเมชั่น
  function animate() {
    walkingMarkers.forEach((wm, idx) => {
      if (!wm) return;
      walkingAngles[idx] = (walkingAngles[idx] || 0) + ANIMATION_SPEED;
      const angle = walkingAngles[idx];
      const z = wm.zone;
      const pos = getCirclePoint(z.lat, z.lng, z._radius || 100, angle);
      wm.marker.setLatLng(pos);
    });
    animFrameId = requestAnimationFrame(animate);
  }
  animate();
}

// ========== หาจุดบนวงกลม ==========
function getCirclePoint(centerLat, centerLng, radiusMeters, angleRad) {
  // approximate: 1 องศาละติจูด ≈ 111320m, 1 องศาลองจิจูด ≈ cos(lat)*111320m
  const latPerM = 1 / 111320;
  const lngPerM = 1 / (111320 * Math.cos(centerLat * Math.PI / 180));
  const dx = radiusMeters * Math.cos(angleRad);
  const dy = radiusMeters * Math.sin(angleRad);
  return [centerLat + dy * latPerM, centerLng + dx * lngPerM];
}

// ========== เริ่ม ==========
document.addEventListener('DOMContentLoaded', initMap);

// หยุดอนิเมชั่นเมื่อออกจากหน้า
window.addEventListener('beforeunload', () => {
  if (animFrameId) cancelAnimationFrame(animFrameId);
});
</script>
<!-- Leaflet Locate plugin -->
<script src="https://unpkg.com/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.css" />
</body>
