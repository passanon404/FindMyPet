<!DOCTYPE html>
<html lang="th">
<head><meta charset="utf-8"><meta content="width=device-width,initial-scale=1" name="viewport">
<title>FindMyPet - แผนที่</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  body{font-family:Inter,sans-serif;background:#f3faff;color:#071e27}
  .material-symbols-outlined{font-variation-settings:'FILL'0,'wght'400,'GRAD'0,'opsz'24}
  #map{width:100%;height:calc(100vh - 80px);min-height:500px;border-radius:0}
</style>
</head>
<body class="flex flex-col h-screen overflow-hidden">
<header class="bg-[#f3faff] shadow-sm flex justify-between items-center px-6 py-3 w-full sticky top-0 z-50">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#9f4122] text-3xl" style="font-variation-settings:'FILL'1">pets</span>
<h1 class="text-[24px] font-['Plus_Jakarta_Sans'] font-bold text-[#9f4122]">FindMyPet</h1>
</div>
<nav class="hidden md:flex items-center gap-6">
<a href="../index.html" class="text-[#56423c] hover:text-[#9f4122]">ข่าวสาร</a>
<a href="map.html" class="text-[#9f4122] font-bold border-b-2 border-[#9f4122] pb-1">แผนที่</a>
<a href="report.html" class="text-[#56423c] hover:text-[#9f4122]">แจ้งเบาะแส</a>
</div>
<div class="flex items-center gap-3">
<a href="../en/map.html" class="text-sm text-[#56423c] hover:text-[#9f4122]"><span class="material-symbols-outlined text-lg">language</span> EN</a>
<span class="material-symbols-outlined text-[#56423c]">account_circle</span>
</div>
</header>
<main class="flex-1 relative">
<div id="map"></div>
<!-- Floating info card -->
<div class="absolute top-4 left-4 z-[1000] bg-white/90 backdrop-blur-sm rounded-2xl p-4 shadow-lg max-w-xs border border-[#ddc0b8]/20">
<h3 class="font-['Plus_Jakarta_Sans'] font-bold text-[#071e27]">🗺️ แผนที่ FindMyPet</h3>
<p class="text-xs text-[#56423c] mt-1">แสดงตำแหน่งสัตว์และจุดเฝ้าระวังในมหาวิทยาลัย</p>
<div class="mt-2 flex gap-3 text-xs">
<span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-[#9f4122] inline-block"></span> จุดพบสัตว์</span>
<span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-[#286b33] inline-block"></span> โซนปลอดภัย</span>
<span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-[#ba1a1a] inline-block"></span> จุดเสี่ยง</span>
</div>
</div>
</main>
<footer class="bg-[#c7dde9] py-3 px-6 text-center text-xs text-[#56423c]">© 2025 FindMyPet — แผนที่ (OpenStreetMap / Leaflet)</footer>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API_BASE = '/api';

// พิกัดมหาวิทยาลัยพะเยา
const UP_CENTER = [19.1698, 99.9025];

function initMap() {
  const map = L.map('map').setView(UP_CENTER, 16);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(map);

  // วงกลมรัศมี 300m
  L.circle(UP_CENTER, {
    color: '#9f4122',
    fillColor: '#9f4122',
    fillOpacity: 0.06,
    radius: 300
  }).addTo(map);

  // จุดเฝ้าระวังตัวอย่าง
  const spots = [
    { lat: 19.1710, lng: 99.9040, label: 'ประตูทางเข้า 1', type: 'watch' },
    { lat: 19.1685, lng: 99.9015, label: 'ลานจอดรถหน้า ม.', type: 'safe' },
    { lat: 19.1705, lng: 99.9005, label: 'จุดพักริมถนน', type: 'watch' },
    { lat: 19.1678, lng: 99.9035, label: 'ร้านค้าชุมชน', type: 'safe' },
    { lat: 19.1690, lng: 99.9060, label: 'ป้ายรถเมล์', type: 'watch' },
  ];

  spots.forEach(s => {
    const color = s.type === 'safe' ? '#286b33' : '#9f4122';
    const icon = L.divIcon({
      className: '',
      html: `<div style="width:16px;height:16px;border-radius:50%;background:${color};border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3)"></div>`,
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    });
    const marker = L.marker([s.lat, s.lng], { icon }).addTo(map);
    marker.bindPopup(`
      <strong>${s.label}</strong><br>
      <span style="color:#56423c;font-size:12px">${s.type === 'safe' ? '✅ โซนปลอดภัย' : '👁️ จุดเฝ้าระวัง'}</span>
    `);
  });

  // โหลด reports จาก API และวาง marker
  loadReportMarkers(map);

  // แสดงตำแหน่งปัจจุบัน
  if (navigator.geolocation) {
    L.control.locate({
      position: 'topleft',
      strings: { title: 'แสดงตำแหน่งปัจจุบัน' },
      locateOptions: { enableHighAccuracy: true }
    }).addTo(map);
  }
}

async function loadReportMarkers(map) {
  try {
    const res = await fetch(`${API_BASE}/reports?limit=100`);
    const data = await res.json();
    const reports = data.reports || [];

    reports.forEach(r => {
      const lat = parseFloat(r.latitude);
      const lng = parseFloat(r.longitude);
      if (isNaN(lat) || isNaN(lng)) return;

      const isEmergency = r.condition === 'ฉุกเฉิน';
      const color = isEmergency ? '#ba1a1a' : r.condition === 'ประชาสัมพันธ์' ? '#286b33' : '#006398';
      const typeLabel = r.animal_type === 'อื่นๆ' && r.animal_type_custom ? r.animal_type_custom : r.animal_type;

      const marker = L.marker([lat, lng]).addTo(map);
      marker.bindPopup(`
        <b style="font-size:14px">${r.title || typeLabel}</b><br>
        <span style="color:#56423c;font-size:12px">${r.condition}</span><br>
        <a href="../index.html" style="color:#9f4122;font-weight:600;font-size:13px">ดูรายละเอียด →</a>
      `);
    });
  } catch (e) {
    console.error('Failed to load reports:', e);
  }
}

document.addEventListener('DOMContentLoaded', initMap);
</script>
<!-- Leaflet Locate plugin -->
<script src="https://unpkg.com/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.css" />
</body>
</html>
