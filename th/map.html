<!DOCTYPE html>
<html lang="th">
<head><meta charset="utf-8"><meta content="width=device-width,initial-scale=1" name="viewport">
<title>FindMyPet - แผนที่มหาวิทยาลัยพะเยา</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
  body{font-family:Inter,sans-serif;background:#f3faff;color:#071e27}
  .material-symbols-outlined{font-variation-settings:'FILL'0,'wght'400,'GRAD'0,'opsz'24}
  #map{width:100%;height:calc(100vh - 80px);min-height:500px;border-radius:0}
</style>
</head>
<body class="flex flex-col h-screen overflow-hidden">
<header class="bg-[#f3faff] shadow-sm flex justify-between items-center px-6 py-3 w-full sticky top-0 z-50">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#9f4122] text-3xl" style="font-variation-settings:'FILL'1">pets</span>
<h1 class="text-[24px] font-['Plus_Jakarta_Sans'] font-bold text-[#9f4122]">FindMyPet</h1>
</div>
<nav class="hidden md:flex items-center gap-6">
<a href="../index.html" class="text-[#56423c] hover:text-[#9f4122]">ข่าวสาร</a>
<a href="map.html" class="text-[#9f4122] font-bold border-b-2 border-[#9f4122] pb-1">แผนที่</a>
<a href="zones.html" class="text-[#56423c] hover:text-[#9f4122]">โซนกิจกรรม</a>
<a href="report.html" class="text-[#56423c] hover:text-[#9f4122]">แจ้งเบาะแส</a>
</div>
<div class="flex items-center gap-3">
<a href="../en/map.html" class="text-sm text-[#56423c] hover:text-[#9f4122]"><span class="material-symbols-outlined text-lg">language</span> EN</a>
<span class="material-symbols-outlined text-[#56423c]">account_circle</span>
</div>
</header>
<main class="flex-1 relative">
<div id="map"></div>
<!-- Floating info card -->
<div class="absolute top-4 left-4 z-10 bg-white/90 backdrop-blur-sm rounded-2xl p-4 shadow-lg max-w-xs border border-[#ddc0b8]/20">
<h3 class="font-['Plus_Jakarta_Sans'] font-bold text-[#071e27]">📍 บริเวณหน้ามหาวิทยาลัยพะเยา</h3>
<p class="text-xs text-[#56423c] mt-1">พื้นที่จุดเฝ้าระวังสัตว์บริเวณประตูทางเข้ามหาวิทยาลัยและบริเวณโดยรอบ</p>
<div class="mt-2 flex gap-2 text-xs">
<span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-[#9f4122] inline-block"></span> จุดพบสัตว์</span>
<span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-[#286b33] inline-block"></span> โซนปลอดภัย</span>
</div>
</div>
</main>
<footer class="bg-[#c7dde9] py-3 px-6 text-center text-xs text-[#56423c]">© 2025 FindMyPet — แผนที่แสดงพื้นที่หน้ามหาวิทยาลัยพะเยา</footer>

<script>
// กำหนดพิกัดมหาวิทยาลัยพะเยา
const UP_CENTER = { lat: 19.1698, lng: 99.9025 };

function initMap() {
  const map = new google.maps.Map(document.getElementById('map'), {
    center: UP_CENTER,
    zoom: 16,
    mapTypeId: 'roadmap',
    mapTypeControl: true,
    fullscreenControl: true,
    streetViewControl: true,
    zoomControl: true,
    styles: [
      { featureType: 'poi', elementType: 'labels', stylers: [{ visibility: 'on' }] },
      { featureType: 'transit', elementType: 'all', stylers: [{ visibility: 'simplified' }] }
    ]
  });

  // Marker หลัก - หน้ามอ
  new google.maps.Marker({
    position: UP_CENTER,
    map,
    title: 'หน้ามหาวิทยาลัยพะเยา',
    icon: {
      path: google.maps.SymbolPath.CIRCLE,
      scale: 12,
      fillColor: '#9f4122',
      fillOpacity: 1,
      strokeColor: '#ffffff',
      strokeWeight: 3,
    },
    animation: google.maps.Animation.DROP,
  });

  // จุดเฝ้าระวังตัวอย่าง
  const spots = [
    { lat: 19.1710, lng: 99.9040, label: 'ประตูทางเข้า 1', type: 'watch' },
    { lat: 19.1685, lng: 99.9015, label: 'ลานจอดรถหน้า ม.', type: 'safe' },
    { lat: 19.1705, lng: 99.9005, label: 'จุดพักริมถนน', type: 'watch' },
    { lat: 19.1678, lng: 99.9035, label: 'ร้านค้าชุมชน', type: 'safe' },
    { lat: 19.1690, lng: 99.9060, label: 'ป้ายรถเมล์', type: 'watch' },
  ];

  spots.forEach(s => {
    const color = s.type === 'safe' ? '#286b33' : '#9f4122';
    const marker = new google.maps.Marker({
      position: { lat: s.lat, lng: s.lng },
      map,
      title: s.label,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 8,
        fillColor: color,
        fillOpacity: 0.9,
        strokeColor: '#ffffff',
        strokeWeight: 2,
      },
    });

    const infoWindow = new google.maps.InfoWindow({
      content: `<div style="font-family:Inter,sans-serif;padding:4px">
        <strong style="color:#071e27">${s.label}</strong>
        <p style="color:#56423c;font-size:12px;margin:2px 0 0">${s.type === 'safe' ? '✅ โซนปลอดภัย' : '👁️ จุดเฝ้าระวัง'}</p>
      </div>`
    });

    marker.addListener('click', () => infoWindow.open(map, marker));
  });

  // วงกลมรัศมีรอบหน้ามอ
  new google.maps.Circle({
    strokeColor: '#9f4122',
    strokeOpacity: 0.2,
    strokeWeight: 1,
    fillColor: '#9f4122',
    fillOpacity: 0.08,
    map,
    center: UP_CENTER,
    radius: 300,
  });
}
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB41DRUbKWJHPxaFjMAwdrzWzbVKartNGg&callback=initMap" async defer></script>
</body>
</html>
