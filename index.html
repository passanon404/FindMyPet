<!DOCTYPE html>
<html lang="th">
<head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FindMyPet - ประกาศและข่าวสาร</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  body{background:#f3faff;font-family:Inter,sans-serif;color:#071e27}
  .material-symbols-outlined{font-variation-settings:'FILL'0,'wght'400,'GRAD'0,'opsz'24}
  .no-scrollbar::-webkit-scrollbar{display:none}
  .active-filter{background-color:#9f4122;color:white;box-shadow:0 4px 12px rgba(159,65,34,.2)}
  .report-enter{animation:slideIn .3s ease-out}
  @keyframes slideIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  #newsMap{height:400px;border-radius:16px;z-index:1}
  .detail-modal{position:fixed;top:0;left:0;right:0;bottom:0;z-index:999;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;padding:20px}
  .detail-modal.open{display:flex}
  .detail-modal-content{background:white;border-radius:16px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;padding:24px;position:relative}
  .detail-photo{width:100%;max-height:350px;object-fit:cover;border-radius:12px;margin-bottom:16px}
  .address-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#f8f9fa;border-radius:12px;padding:16px;margin:12px 0}
  .address-item{font-size:14px;color:#56423c}
  .address-item strong{color:#071e27;display:block;font-size:12px;text-transform:uppercase;letter-spacing:0.5px}
  .photo-preview{max-width:200px;max-height:200px;border-radius:8px;margin-top:8px;display:none}
  .photo-preview.show{display:block}
</style>
</head>
<body class="min-h-screen bg-[#f3faff]">
<header class="fixed top-0 left-0 right-0 z-50 bg-[#f3faff]/80 backdrop-blur-md shadow-sm">
<nav class="flex justify-between items-center w-full px-6 py-3 max-w-[1200px] mx-auto">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#9f4122] text-3xl" style="font-variation-settings:'FILL'1">pets</span>
<span class="font-bold text-[24px] font-['Plus_Jakarta_Sans'] text-[#9f4122]">FindMyPet</span>
</div>
<div class="hidden md:flex items-center gap-6">
<a href="index.html" class="text-[#9f4122] font-bold border-b-2 border-[#9f4122] pb-1">หน้าข่าวสาร</a>
<a href="th/map.html" class="text-[#56423c] hover:text-[#9f4122]">แผนที่</a>
<a href="th/report.html" class="text-[#56423c] hover:text-[#9f4122]">แจ้งเบาะแส</a>
</div>
<div class="flex items-center gap-3">
<a href="en/news.html" class="text-sm text-[#56423c] hover:text-[#9f4122]"><span class="material-symbols-outlined text-lg">language</span> EN</a>
<span class="material-symbols-outlined text-[#56423c]">account_circle</span>
</div>
</nav>
</header>

<main class="pt-28 pb-8 px-6">
<div class="max-w-4xl mx-auto">
<div class="mb-8 text-center md:text-left">
<h1 class="text-[40px] font-['Plus_Jakarta_Sans'] font-bold text-[#071e27] mb-2" style="letter-spacing:-0.02em">ประกาศและข่าวสาร</h1>
<p class="text-[16px] text-[#56423c]">เกาะติดสถานการณ์สัตว์เลี้ยงและกิจกรรมต่างๆ ในรั้วมหาวิทยาลัย</p>
</div>

<!-- Filter Buttons: ทั้งหมด | ฉุกเฉิน | พบเห็น | ประชาสัมพันธ์ -->
<div id="condition-filters" class="flex items-center gap-3 overflow-x-auto pb-4 mb-6 no-scrollbar">
<button class="filter-btn px-4 py-2 rounded-full text-sm font-semibold border border-[#ddc0b8] text-[#56423c] active-filter transition-all" data-filter="all">📰 ทั้งหมด</button>
<button class="filter-btn px-4 py-2 rounded-full text-sm font-semibold border border-[#ddc0b8] text-[#56423c] hover:bg-[#d5ecf8] transition-all" data-filter="ฉุกเฉิน">🚨 ฉุกเฉิน</button>
<button class="filter-btn px-4 py-2 rounded-full text-sm font-semibold border border-[#ddc0b8] text-[#56423c] hover:bg-[#d5ecf8] transition-all" data-filter="พบเห็น">👀 พบเห็น</button>
<button class="filter-btn px-4 py-2 rounded-full text-sm font-semibold border border-[#ddc0b8] text-[#56423c] hover:bg-[#d5ecf8] transition-all" data-filter="ประชาสัมพันธ์">📣 ประชาสัมพันธ์</button>
</div>

<!-- News Container -->
<div id="reports-container" class="grid grid-cols-1 gap-6">
<div class="text-center py-12 text-[#56423c]">
<span class="material-symbols-outlined text-5xl">hourglass_empty</span>
<p class="mt-4">กำลังโหลดข้อมูล...</p>
</div>
</div>

<!-- Leaflet Map Section -->
<section class="mt-8 bg-white rounded-2xl p-6 shadow-sm border border-[#ddc0b8]/20">
<h2 class="text-[20px] font-['Plus_Jakarta_Sans'] font-bold text-[#071e27] mb-4">🗺️ แผนที่</h2>
<div id="newsMap"></div>
</section>
</div>
</main>

<!-- Detail Modal -->
<div id="detailModal" class="detail-modal">
<div class="detail-modal-content">
<button onclick="closeDetail()" class="absolute top-4 right-4 text-[#56423c] hover:text-[#071e27]">
<span class="material-symbols-outlined">close</span>
</button>
<div id="detailContent"></div>
</div>
</div>

<footer class="bg-[#c7dde9] py-4 px-6 flex flex-col md:flex-row justify-between items-center">
<p class="text-xs text-[#56423c]">© 2025 FindMyPet - เพื่อนที่ดีที่สุดของสัตว์จรจัด</p>
<div class="flex gap-6 mt-2 md:mt-0">
<a href="#" class="text-xs text-[#56423c] hover:text-[#9f4122]">ติดต่อเรา</a>
<a href="#" class="text-xs text-[#56423c] hover:text-[#9f4122]">นโยบายความเป็นส่วนตัว</a>
</div>
</footer>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API_BASE = '/api';
let currentFilter = 'all';
let newsMap = null;
let newsMarkers = [];

/* ========== Load Reports ========== */
async function loadReports() {
  const container = document.getElementById('reports-container');
  container.innerHTML = '<div class="text-center py-12 text-[#56423c]"><span class="material-symbols-outlined text-5xl">hourglass_empty</span><p class="mt-4">กำลังโหลดข้อมูล...</p></div>';

  try {
    const filterParam = currentFilter === 'all' ? '' : `&filter=${encodeURIComponent(currentFilter)}`;
    const res = await fetch(`${API_BASE}/reports?limit=100${filterParam}`);
    const data = await res.json();
    renderReports(data.reports || []);
    updateMap(data.reports || []);
  } catch (e) {
    container.innerHTML = '<div class="text-center py-12 text-[#56423c]"><span class="material-symbols-outlined text-5xl">cloud_off</span><p class="mt-4">ไม่สามารถโหลดข้อมูลได้ กรุณาลองใหม่อีกครั้ง</p></div>';
  }
}

/* ========== Render Reports ========== */
function renderReports(reports) {
  const container = document.getElementById('reports-container');

  if (reports.length === 0) {
    container.innerHTML = '<div class="text-center py-12 text-[#56423c]"><span class="material-symbols-outlined text-5xl">pets</span><p class="mt-4">ไม่พบข้อมูลในหมวดนี้</p></div>';
    return;
  }

  container.innerHTML = reports.map((r, i) => {
    const timeAgo = getTimeAgo(r.created_at);
    const typeLabel = r.animal_type === 'อื่นๆ' && r.animal_type_custom ? r.animal_type_custom : r.animal_type;
    const isEmergency = r.condition === 'ฉุกเฉิน';
    const badgeColor = isEmergency ? '#ba1a1a' : r.condition === 'ประชาสัมพันธ์' ? '#286b33' : '#006398';
    const badgeIcon = isEmergency ? 'emergency' : r.condition === 'ประชาสัมพันธ์' ? 'campaign' : 'visibility';

    // Address snippet
    const addrParts = [r.house_no, r.village_lane, r.road, r.sub_district, r.district, r.province].filter(Boolean);
    const addrText = addrParts.length > 0 ? addrParts.join(', ') : r.location || '';

    return `
      <article class="report-enter bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-all flex flex-col md:flex-row group border border-[#ddc0b8]/20 cursor-pointer" style="animation-delay:${i * 0.1}s" onclick="showDetail(${JSON.stringify(r).replace(/"/g,'&quot;')})">
        <div class="md:w-1/3 h-56 md:h-auto relative overflow-hidden bg-[#dbf1fe] flex items-center justify-center">
          ${r.photo
            ? `<img src="${r.photo}" alt="${typeLabel}" class="w-full h-full object-cover">`
            : `<span class="material-symbols-outlined text-6xl text-[#9f4122]" style="font-variation-settings:'FILL'1">pets</span>`
          }
          <div class="absolute top-4 left-4">
            <span class="text-white text-xs px-3 py-1 rounded-full flex items-center gap-1 shadow-lg" style="background-color:${badgeColor}">
              <span class="material-symbols-outlined text-[14px]">${badgeIcon}</span>
              ${r.condition}
            </span>
          </div>
        </div>
        <div class="p-6 md:w-2/3 flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-start mb-2">
              <h2 class="text-[22px] font-['Plus_Jakarta_Sans'] font-semibold text-[#071e27]">${r.title || typeLabel}</h2>
              <span class="text-xs text-[#89726b] whitespace-nowrap ml-2">${timeAgo}</span>
            </div>
            <p class="text-[15px] text-[#56423c] mb-3">${r.description || 'ไม่ระบุรายละเอียด'}</p>
            <div class="flex items-center gap-4 text-xs text-[#56423c] mb-2 flex-wrap">
              <span class="flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">location_on</span> ${addrText || 'ไม่ระบุสถานที่'}</span>
              ${r.contact ? `<span class="flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">call</span> ${r.contact}</span>` : ''}
            </div>
            ${r.latitude && r.longitude ? `<div class="text-xs text-[#89726b]">📍 GPS: ${parseFloat(r.latitude).toFixed(4)}, ${parseFloat(r.longitude).toFixed(4)}</div>` : ''}
          </div>
        </div>
      </article>
    `;
  }).join('');
}

/* ========== Show Detail Modal ========== */
function showDetail(r) {
  if (typeof r === 'string') r = JSON.parse(r);
  const content = document.getElementById('detailContent');
  const isEmergency = r.condition === 'ฉุกเฉิน';
  const badgeColor = isEmergency ? '#ba1a1a' : r.condition === 'ประชาสัมพันธ์' ? '#286b33' : '#006398';
  const badgeIcon = isEmergency ? 'emergency' : r.condition === 'ประชาสัมพันธ์' ? 'campaign' : 'visibility';
  const typeLabel = r.animal_type === 'อื่นๆ' && r.animal_type_custom ? r.animal_type_custom : r.animal_type;

  const addrFields = [
    { label: 'บ้านเลขที่', val: r.house_no },
    { label: 'หมู่ / ซอย', val: r.village_lane },
    { label: 'ถนน', val: r.road },
    { label: 'ตำบล / แขวง', val: r.sub_district },
    { label: 'อำเภอ / เขต', val: r.district },
    { label: 'จังหวัด', val: r.province },
    { label: 'รหัสไปรษณีย์', val: r.postal_code },
  ].filter(f => f.val);

  content.innerHTML = `
    <div class="flex items-center gap-2 mb-4">
      <span class="text-white text-xs px-3 py-1 rounded-full flex items-center gap-1 shadow-lg" style="background-color:${badgeColor}">
        <span class="material-symbols-outlined text-[14px]">${badgeIcon}</span>
        ${r.condition}
      </span>
      <span class="text-xs text-[#89726b]">${getTimeAgo(r.created_at)}</span>
    </div>
    <h2 class="text-[26px] font-['Plus_Jakarta_Sans'] font-bold text-[#071e27] mb-3">${r.title || typeLabel}</h2>
    ${r.photo ? `<img src="${r.photo}" alt="${typeLabel}" class="detail-photo">` : ''}
    <p class="text-[16px] text-[#56423c] mb-4">${r.description || 'ไม่ระบุรายละเอียด'}</p>

    ${addrFields.length > 0 ? `
      <div class="address-grid">
        ${addrFields.map(f => `
          <div class="address-item"><strong>${f.label}</strong> ${f.val}</div>
        `).join('')}
      </div>
    ` : ''}

    ${r.contact ? `
      <div class="flex items-center gap-2 text-[15px] text-[#56423c] mb-3">
        <span class="material-symbols-outlined text-[18px]">call</span>
        <a href="tel:${r.contact}" class="text-[#9f4122] font-semibold">${r.contact}</a>
      </div>
    ` : ''}

    ${r.reporter_name ? `
      <div class="flex items-center gap-2 text-[15px] text-[#56423c] mb-3">
        <span class="material-symbols-outlined text-[18px]">person</span> ${r.reporter_name}
      </div>
    ` : ''}

    ${r.latitude && r.longitude ? `
      <div id="detailMiniMap" style="height:250px;border-radius:12px;margin-top:12px"></div>
    ` : ''}
  `;

  document.getElementById('detailModal').classList.add('open');

  // Init mini map
  if (r.latitude && r.longitude) {
    setTimeout(() => {
      const mini = L.map('detailMiniMap').setView([parseFloat(r.latitude), parseFloat(r.longitude)], 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
      }).addTo(mini);
      L.marker([parseFloat(r.latitude), parseFloat(r.longitude)]).addTo(mini)
        .bindPopup(`<b>${r.title || typeLabel}</b>`).openPopup();
    }, 100);
  }
}

function closeDetail() {
  document.getElementById('detailModal').classList.remove('open');
}

// Close modal on backdrop click
document.getElementById('detailModal').addEventListener('click', function(e) {
  if (e.target === this) closeDetail();
});

/* ========== Leaflet Map ========== */
function initNewsMap() {
  const el = document.getElementById('newsMap');
  if (!el) return;
  newsMap = L.map('newsMap').setView([19.17, 99.90], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(newsMap);
}

function updateMap(reports) {
  if (!newsMap) return;

  // Clear old markers
  newsMarkers.forEach(m => newsMap.removeLayer(m));
  newsMarkers = [];

  const bounds = [];
  reports.forEach(r => {
    const lat = parseFloat(r.latitude);
    const lng = parseFloat(r.longitude);
    if (isNaN(lat) || isNaN(lng)) return;

    const isEmergency = r.condition === 'ฉุกเฉิน';
    const color = isEmergency ? '#ba1a1a' : r.condition === 'ประชาสัมพันธ์' ? '#286b33' : '#006398';
    const badgeIcon = isEmergency ? 'emergency' : r.condition === 'ประชาสัมพันธ์' ? 'campaign' : 'visibility';

    const marker = L.marker([lat, lng]).addTo(newsMap);
    const typeLabel = r.animal_type === 'อื่นๆ' && r.animal_type_custom ? r.animal_type_custom : r.animal_type;
    marker.bindPopup(`
      <b style="font-size:14px">${r.title || typeLabel}</b><br>
      <span style="color:#56423c;font-size:12px">${r.condition}</span><br>
      <button onclick="showDetail(${JSON.stringify(r).replace(/"/g,'&quot;')})" style="background:#9f4122;color:white;border:none;padding:6px 12px;border-radius:8px;margin-top:6px;cursor:pointer">ดูรายละเอียด</button>
    `);
    newsMarkers.push(marker);
    bounds.push([lat, lng]);
  });

  if (bounds.length > 0) {
    newsMap.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
  }
}

/* ========== Helpers ========== */
function getConditionLabel(cond) {
  const map = { 'ฉุกเฉิน': 'ฉุกเฉิน', 'พบเห็น': 'พบเห็น', 'ประชาสัมพันธ์': 'ประชาสัมพันธ์' };
  return map[cond] || cond;
}

function getTimeAgo(dateStr) {
  const now = new Date();
  const date = new Date(dateStr + 'Z');
  const diff = Math.floor((now - date) / 1000);
  if (diff < 60) return 'เมื่อสักครู่';
  if (diff < 3600) return `${Math.floor(diff / 60)} นาทีที่แล้ว`;
  if (diff < 86400) return `${Math.floor(diff / 3600)} ชั่วโมงที่แล้ว`;
  if (diff < 604800) return `${Math.floor(diff / 86400)} วันที่แล้ว`;
  return date.toLocaleDateString('th-TH');
}

/* ========== Init ========== */
document.addEventListener('DOMContentLoaded', () => {
  initNewsMap();
  loadReports();

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active-filter'));
      btn.classList.add('active-filter');
      currentFilter = btn.dataset.filter;
      loadReports();
    });
  });
});
</script>
</body>
</html>
