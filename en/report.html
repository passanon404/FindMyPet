<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>FindMyPet - Report Sighting / Emergency</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body{background:#f3faff;font-family:Inter,sans-serif;color:#071e27}
  .material-symbols-outlined{font-variation-settings:'FILL'0,'wght'400,'GRAD'0,'opsz'24}
  .form-input{border:1px solid #ddc0b8;border-radius:12px;padding:12px 16px;width:100%;font-size:16px;background:white}
  .form-input:focus{outline:2px solid #9f4122;outline-offset:-1px}
</style>
</head>
<body class="min-h-screen">
<header class="sticky top-0 z-50 bg-[#f3faff]/80 backdrop-blur-md shadow-sm">
<nav class="flex justify-between items-center w-full px-6 py-3 max-w-[1200px] mx-auto">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#9f4122] text-3xl" style="font-variation-settings:'FILL'1">pets</span>
<span class="font-bold text-[24px] font-['Plus_Jakarta_Sans'] text-[#9f4122]">FindMyPet</span>
</div>
<div class="hidden md:flex items-center gap-6">
<a href="news.html" class="text-[#56423c] hover:text-[#9f4122]">News</a>
<a href="map.html" class="text-[#56423c] hover:text-[#9f4122]">Map</a>
<a href="zones.html" class="text-[#56423c] hover:text-[#9f4122]">Zones</a>
<a href="report.html" class="text-[#9f4122] font-bold border-b-2 border-[#9f4122] pb-1">Report</a>
</div>
<div class="flex items-center gap-3">
<a href="../th/report.html" class="text-sm text-[#56423c] hover:text-[#9f4122]"><span class="material-symbols-outlined text-lg">language</span> TH</a>
<span class="material-symbols-outlined text-[#56423c]">account_circle</span>
</div>
</nav>
</header>
<main class="py-8 px-6">
<div class="max-w-3xl mx-auto">
<div class="mb-8"><h1 class="text-[40px] font-['Plus_Jakarta_Sans'] font-bold text-[#071e27]" style="letter-spacing:-0.02em">Report a Sighting</h1><p class="text-[16px] text-[#56423c]">Help us track and care for campus animals</p></div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
<button class="bg-white p-6 rounded-2xl border-2 border-[#9f4122] shadow-sm hover:shadow-md transition-all text-center">
<span class="material-symbols-outlined text-4xl text-[#9f4122]" style="font-variation-settings:'FILL'1">visibility</span>
<h3 class="text-lg font-['Plus_Jakarta_Sans'] font-bold mt-2">Report Sighting</h3>
<p class="text-sm text-[#56423c]">Saw an animal on campus? Let us know!</p>
</button>
<button class="bg-white p-6 rounded-2xl border border-[#ba1a1a] shadow-sm hover:shadow-md transition-all text-center">
<span class="material-symbols-outlined text-4xl text-[#ba1a1a]" style="font-variation-settings:'FILL'1">emergency</span>
<h3 class="text-lg font-['Plus_Jakarta_Sans'] font-bold mt-2">Emergency Case</h3>
<p class="text-sm text-[#56423c]">Injured or in danger? Report urgently!</p>
</button>
</div>
<div class="bg-white rounded-2xl p-8 shadow-sm border border-[#ddc0b8]/20">
<h2 class="text-[24px] font-['Plus_Jakarta_Sans'] font-semibold mb-6">Sighting Details</h2>
<form class="space-y-4">
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div><label class="block text-sm font-semibold mb-1">Animal Type</label>
<select class="form-input"><option>Dog</option><option>Cat</option><option>Other</option></select></div>
<div><label class="block text-sm font-semibold mb-1">Condition</label>
<select class="form-input"><option>Healthy</option><option>Injured</option><option>Sick</option><option>Emergency</option></select></div>
</div>
<div><label class="block text-sm font-semibold mb-1">Location</label>
<input class="form-input" placeholder="e.g. Near Science Building"/></div>
<div><label class="block text-sm font-semibold mb-1">Description</label>
<textarea class="form-input" rows="3" placeholder="Describe what you saw..."></textarea></div>
<div><label class="block text-sm font-semibold mb-1">Your Contact (optional)</label>
<input class="form-input" placeholder="Phone or email"/></div>
<button class="w-full bg-[#9f4122] text-white font-semibold py-3 rounded-xl hover:bg-opacity-90 transition-all flex items-center justify-center gap-2"><span class="material-symbols-outlined">send</span> Submit Report</button>
</form>
</div>
</div>
</main>
<footer class="bg-[#c7dde9] py-4 px-6 flex flex-col md:flex-row justify-between items-center mt-8">
<p class="text-xs text-[#56423c]">© 2025 FindMyPet</p>
<div class="flex gap-6"><a href="#" class="text-xs text-[#56423c] hover:text-[#9f4122]">Contact</a><a href="#" class="text-xs text-[#56423c] hover:text-[#9f4122]">Privacy</a></div>
</footer>
</body>
</html>
